name: CI - Lint and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install backend dependencies
      run: |
        cd backend
        pip install -r requirements.txt
        pip install -r ../tests/requirements.txt
    
    - name: Run backend tests
      run: |
        cd tests
        pytest test_hash.py -v --tb=short
    
    - name: Check demo script
      run: |
        python demo_run.py

  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install flake8
    
    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 backend --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci
    
    - name: Build frontend
      run: |
        cd frontend
        npm run build

  safety-check:
    name: Safety Configuration Check
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Verify safety defaults
      run: |
        echo "Checking that safety constraints are properly configured..."
        
        # Check that config example has safe defaults
        if grep -q "allow_external_fetch: false" backend/app/config.example.yaml; then
          echo "✓ allow_external_fetch is false"
        else
          echo "✗ ERROR: allow_external_fetch must default to false"
          exit 1
        fi
        
        if grep -q "escalate_to_hotline: false" backend/app/config.example.yaml; then
          echo "✓ escalate_to_hotline is false"
        else
          echo "✗ ERROR: escalate_to_hotline must default to false"
          exit 1
        fi
        
        # Check that gitignore excludes sensitive files
        if grep -q "config.yaml" .gitignore; then
          echo "✓ config.yaml is in .gitignore"
        else
          echo "✗ ERROR: config.yaml must be in .gitignore"
          exit 1
        fi
        
        echo "✓ All safety checks passed"
